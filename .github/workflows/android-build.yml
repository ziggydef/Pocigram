name: Pocigram Android Build

on:
workflow_dispatch:
push:
branches:
- ziggy-dev
paths:
- '.github/workflows/android-build.yml'
- 'TMessagesProj/'
- 'TMessagesProj_App/'
- 'TMessagesProj_Modules/'
- 'build.gradle'
- 'settings.gradle'
- 'gradle.properties'
- 'buildSrc/'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04
timeout-minutes: 180

steps:
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      submodules: recursive
      fetch-depth: 1

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: |
      yes | sdkmanager --licenses || true

  - name: Install Android dependencies
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "ndk;27.2.12479018" \
        "cmake;3.22.1"

  - name: Verify Android SDK
    run: |
      sdkmanager --list_installed

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Pocigram
    run: |
      chmod +x gradlew
      ./gradlew :TMessagesProj_App:assembleAfatDebug \
        --no-daemon \
        --stacktrace \
        --max-workers=2 \
        -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Pocigram-Android-Debug
      path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
      if-no-files-found: error
      retention-days: 14
