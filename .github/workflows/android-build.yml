name: Pocigram Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - ziggy-dev
    paths:
      - '.github/workflows/final-build-trigger'

concurrency:
  group: pocigram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android dependencies
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Pocigram
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocigram-Android-Debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
